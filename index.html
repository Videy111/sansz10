<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Video Trending</title>

<meta name="description"
      content="Tonton video terbaru dan video lainnya.">

<meta property="og:title"
      content="Video Trending">

<meta property="og:description"
      content="Tonton video terbaru dan video lainnya.">

<meta property="og:image"
      content="https://jpcdn.it/img/85026057906f049244905cafa5704ba6.jpg">

<meta property="og:type"
      content="website">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="Video Trending">

<meta name="twitter:description"
      content="Tonton video terbaru dan video lainnya.">

<meta name="twitter:image"
      content="https://jpcdn.it/img/85026057906f049244905cafa5704ba6.jpg">


<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at top left,
            rgba(111,76,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at top right,
            rgba(255,45,150,.12),
            transparent 30%
        ),
        #08080d;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding-bottom:40px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    max-width:850px;

    margin:0 auto;

    padding:
        18px
        14px
        30px;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7b5cff,
            #c52cff
        );

    box-shadow:
        0 8px 30px
        rgba(124,80,255,.30);

    font-size:20px;
}

.logo-text{
    font-size:19px;
    font-weight:800;

    letter-spacing:.2px;
}

.header-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#7dffb2;

    box-shadow:
        0 0 12px
        rgba(125,255,178,.8);
}


/* =========================
   VIDEO AREA
========================= */

.video-box{
    position:relative;

    width:100%;

    overflow:hidden;

    border-radius:20px;

    background:#000;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55),

        0 0 0 1px
        rgba(255,255,255,.06);
}

.video-box video{
    display:block;

    width:100%;

    height:auto;

    aspect-ratio:16 / 9;

    background:#000;

    object-fit:cover;
}


/* =========================
   VIDEO BADGE
========================= */

.video-badge{
    position:absolute;

    top:13px;
    left:13px;

    z-index:5;

    padding:7px 11px;

    border-radius:999px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:11px;
    font-weight:700;

    letter-spacing:.7px;

    color:#fff;
}


/* =========================
   FULLSCREEN BUTTON
========================= */

.fullscreen-button{
    position:absolute;

    right:12px;
    top:12px;

    z-index:10;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;

    border-radius:12px;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    font-size:19px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    transition:
        transform .2s ease,
        background .2s ease;
}

.fullscreen-button:hover{
    transform:scale(1.05);

    background:
        rgba(108,75,255,.85);
}


/* =========================
   VIDEO INFO
========================= */

.video-info{
    padding:
        18px
        4px
        10px;
}

.video-title{
    font-size:23px;

    line-height:1.25;

    font-weight:800;

    margin-bottom:7px;
}

.video-description{
    color:#a9a9b5;

    font-size:13px;

    line-height:1.6;
}


/* =========================
   DIVIDER
========================= */

.divider{
    width:100%;
    height:1px;

    margin:
        18px
        0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    display:flex;
    align-items:center;

    gap:8px;

    margin-bottom:12px;

    font-size:15px;

    font-weight:800;
}


/* =========================
   COLLECTION BUTTON
========================= */

.collection-box{
    display:block;

    width:100%;

    padding:
        17px
        15px;

    text-decoration:none;

    color:#fff;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #6848ff 0%,
            #8b35ff 45%,
            #e12b9a 100%
        );

    box-shadow:
        0 15px 35px
        rgba(113,62,255,.24);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.collection-box:hover{
    transform:translateY(-2px);

    box-shadow:
        0 20px 45px
        rgba(113,62,255,.35);
}

.collection-title{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    font-size:16px;

    font-weight:900;

    letter-spacing:.5px;

    text-align:center;
}

.collection-subtitle{
    margin-top:7px;

    text-align:center;

    font-size:12px;

    color:
        rgba(255,255,255,.82);
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    color:#666673;

    font-size:11px;

    margin-top:24px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        padding:
            13px
            10px
            25px;
    }

    .logo-icon{
        width:38px;
        height:38px;

        border-radius:11px;
    }

    .logo-text{
        font-size:17px;
    }

    .video-box{
        border-radius:16px;
    }

    .video-title{
        font-size:20px;
    }

    .fullscreen-button{
        width:38px;
        height:38px;

        top:9px;
        right:9px;

        border-radius:10px;

        font-size:17px;
    }

    .video-badge{
        top:9px;
        left:9px;

        padding:6px 9px;

        font-size:10px;
    }

}


/* =========================
   DESKTOP FULLSCREEN
========================= */

.video-box:fullscreen{
    width:100vw;
    height:100vh;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:0;
}

.video-box:fullscreen video{
    width:100%;
    height:100%;

    aspect-ratio:auto;

    object-fit:contain;
}


/* =========================
   SAFARI FULLSCREEN
========================= */

.video-box:-webkit-full-screen{
    width:100vw;
    height:100vh;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:0;
}

.video-box:-webkit-full-screen video{
    width:100%;
    height:100%;

    object-fit:contain;
}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ▶
            </div>

            <div class="logo-text">
                Video Player
            </div>

        </div>

        <div class="header-dot"></div>

    </header>



    <!-- =========================
         VIDEO
    ========================== -->

    <div
        class="video-box"
        id="videoBox"
    >

        <div class="video-badge">
            ● NOW PLAYING
        </div>


        <button
            class="fullscreen-button"
            id="fullscreenButton"
            type="button"
            aria-label="Fullscreen"
        >
            ⛶
        </button>


        <video
            id="mainVideo"
            controls
            playsinline
            preload="metadata"
            poster="https://jpcdn.it/img/85026057906f049244905cafa5704ba6.jpg"
        >

            <source
                src="https://cdn2.videy.co/WgAfG3HX1.mp4"
                type="video/mp4"
            >

            Browser Anda tidak mendukung video HTML5.

        </video>

    </div>



    <!-- =========================
         VIDEO INFO
    ========================== -->

    <div class="video-info">

        <div class="video-title">
            Video Trending
        </div>

        <div class="video-description">
            Nikmati video dengan tampilan player yang nyaman
            dan responsif di perangkat mobile maupun desktop.
        </div>

    </div>



    <div class="divider"></div>



    <!-- =========================
         VIDEO LAINNYA
    ========================== -->

    <div class="section-title">
        ✨
        <span>Video Lainnya</span>
    </div>



    <!-- =========================
         COLLECTION BUTTON
    ========================== -->

    <a
        href="https://www.profitableratecpmnetwork.com/dzth71h9?key=0d1e630d97de4d34d79e6dd18d6a2fe8"
        class="collection-box"
        target="_blank"
        rel="noopener noreferrer"
    >

        <div class="collection-title">

            <span>➡️</span>

            <span>
                KUMPULAN VIDEO
            </span>

            <span>⬅️</span>

        </div>

        <div class="collection-subtitle">
            🎬 Lihat video lainnya di sini
        </div>

    </a>



    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">
        Video Player • Mobile Friendly
    </div>


</div>



<script>

/* =========================
   VIDEO
========================= */

const video =
    document.getElementById("mainVideo");


const videoBox =
    document.getElementById("videoBox");


const fullscreenButton =
    document.getElementById("fullscreenButton");


/* =========================
   FULLSCREEN
========================= */

fullscreenButton.addEventListener(
    "click",
    function(){

        if(
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ){

            if(document.exitFullscreen){

                document.exitFullscreen();

            }else if(document.webkitExitFullscreen){

                document.webkitExitFullscreen();

            }

            return;
        }


        if(videoBox.requestFullscreen){

            videoBox.requestFullscreen();

        }else if(videoBox.webkitRequestFullscreen){

            videoBox.webkitRequestFullscreen();

        }else if(video.webkitEnterFullscreen){

            video.webkitEnterFullscreen();

        }

    }
);


/* =========================
   FULLSCREEN ICON
========================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(document.fullscreenElement){

            fullscreenButton.textContent = "⛶";

        }else{

            fullscreenButton.textContent = "⛶";

        }

    }
);


/* =========================
   WEBKIT FULLSCREEN
========================= */

document.addEventListener(
    "webkitfullscreenchange",
    function(){

        fullscreenButton.textContent = "⛶";

    }
);

</script>


</body>

</html>
